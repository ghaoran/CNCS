# GitHub Actions CI/CD - Fixed for CNCS

name: CNCS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    strategy:
      matrix:
        configuration: [Debug, Release]
        include:
          - configuration: Debug
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug"
          - configuration: Release
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Initialize submodules
      if: steps.checkout.outputs.submodules != 'true'
      run: |
        git submodule update --init --recursive --depth 1

    - name: Setup MSBuild (pre-installed VS 2022)
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '2022'

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ env.VCPKG_ROOT }}/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat

    - name: Install deps
      run: |
        ./vcpkg/vcpkg.exe install --triplet x64-windows --feature-flags=manifests

    - name: Install clang-format
      run: |
        choco install llvm --version 18.1.8 -y --no-progress
        $env:PATH += ";C:\Program Files\LLVM\bin"

    - name: Configure CMake
      run: |
        cmake -B build ${{ matrix.cmake_args }} -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.configuration }} --parallel

    - name: Test
      if: matrix.configuration == 'Debug'
      run: |
        ctest --test-dir build --output-on-failure -C Debug

    - name: Build driver (skip if WDK not available)
      run: |
        cd driver
        $WdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\build\10.0.22621.0"
        if (Test-Path $WdkPath) {
          Write-Host "WDK found, building driver..."
          powershell -ExecutionPolicy Bypass -File build_driver.ps1 -Configuration ${{ matrix.configuration }} -TestSign
        } else {
          Write-Warning "WDK not found, skipping driver build"
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CNCS-${{ matrix.configuration }}
        path: |
          build/bin/${{ matrix.configuration }}/CNCS.exe
          driver/x64/${{ matrix.configuration }}/CNCS_drv.sys
        retention-days: 30
        if-no-files-found: ignore

    - name: Format check
      continue-on-error: true
      run: |
        $files = Get-ChildItem -Recurse -Path src -Include *.cpp,*.hpp,*.h,*.c | Select-Object -ExpandProperty FullName
        if ($files) {
          clang-format --dry-run --Werror $files
        }

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: CNCS-*
        merge-multiple: true
        path: artifacts

    - name: Package
      run: |
        mkdir release -Force
        copy artifacts\bin\Release\CNCS.exe release\
        if (Test-Path "artifacts\driver\x64\Release\CNCS_drv.sys") {
          copy artifacts\driver\x64\Release\CNCS_drv.sys release\
        }
        mkdir release\maps -Force
        copy src\embedded\*.m2 release\maps\

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
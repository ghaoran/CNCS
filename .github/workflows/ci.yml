# GitHub Actions CI/CD - Fixed for CNCS

name: CNCS CI/CD

on:
  push:
    branches: [main, develop]
    # 修复：release job 的条件是 refs/tags/*，但这里原来只监听分支，
    # 导致 tag 推送根本不触发 workflow，Release 永远不会产出。
    tags: ['v*', '[0-9]*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        include:
          - configuration: Debug
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON"
          - configuration: Release
            cmake_args: "-DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild (pre-installed VS 2022)
      uses: microsoft/setup-msbuild@v2

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ env.VCPKG_ROOT }}/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat

    - name: Install deps
      run: |
        # 与 VCPKG_DEFAULT_TRIPLET 保持一致：静态 CRT (/MT) 需要 x64-windows-static
        ./vcpkg/vcpkg.exe install --triplet x64-windows-static

    - name: Configure CMake
      run: |
        cmake -B build ${{ matrix.cmake_args }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.configuration }} --parallel

    - name: Test
      run: |
        # CNCS_Core 已抽成可移植静态库，Debug/Release 都直接跑同一套用例。
        ctest --test-dir build --output-on-failure -C ${{ matrix.configuration }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CNCS-${{ matrix.configuration }}
        # 上传整个输出目录：CNCS.exe + vcpkg 部署的同目录依赖 DLL
        path: |
          build/bin/${{ matrix.configuration }}/
        retention-days: 30
        if-no-files-found: ignore

    - name: Format check (changed files only)
      # 仅检查本次改动到的问题行：
      #   1) 仓库历史代码尚未整体 clang-format（约 1.3 万处），全量检查没有信息量；
      #   2) .clang-format 之前有重复键 PointerAlignment 和非法键 TemplateDepth，
      #      clang-format 会直接拒绝读取整个配置 —— 已修复，现在配置可正常解析。
      continue-on-error: true
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { Write-Warning "vswhere not found, skipping"; exit 0 }
        $vsPath = & $vswhere -latest -property installationPath
        if (-not $vsPath) { Write-Warning "VS not found, skipping"; exit 0 }
        $clangFormat = Get-ChildItem "$vsPath\VC\Tools\Llvm" -Recurse -Filter clang-format.exe |
                         Select-Object -First 1 -ExpandProperty FullName
        if (-not $clangFormat) { Write-Warning "clang-format not found, skipping"; exit 0 }
        Write-Host "Using $clangFormat"

        # 只取相对上一个提交新增/修改的 C++ 源文件，且排除 vendored 第三方目录
        $changed = git diff --name-only --diff-filter=ACMR HEAD~1 HEAD 2>$null
        $files = $changed |
                   Where-Object { $_ -match '\.(cpp|hpp|h|c)$' } |
                   Where-Object { $_ -notmatch '(^|/)(external|third_party)/' } |
                   Where-Object { Test-Path $_ }
        if (-not $files) { Write-Host "No changed C++ files, skipping"; exit 0 }

        Write-Host "Checking $($files.Count) changed file(s)"
        & $clangFormat --dry-run --Werror $files

  # 可移植性守卫：Windows 专用 job 永远发现不了 core 里悄悄引入 <Windows.h>、
  # d3d11 或 MSVC-only flag 的问题（历史上就是这些把 core 与测试一起带崩的）。
  # 这个 job 在 Linux 上只构建 CNCS_Core + 单元测试，任何平台耦合都会立刻失败。
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install toolchain and deps
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq cmake ninja-build g++ catch2 libfmt-dev nlohmann-json3-dev zlib1g-dev

    - name: Configure (portable core + tests)
      run: |
        cmake -S . -B build-portable -G Ninja           -DCMAKE_BUILD_TYPE=Debug           -DBUILD_TESTS=ON

    - name: Build core and tests
      run: cmake --build build-portable --parallel

    - name: Run unit tests
      run: ctest --test-dir build-portable --output-on-failure

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    # release job 要读 src/embedded/*.m2，因此必须先 checkout 源码
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        # 修复：原来 pattern 是 CNCS-*，会把 Debug 产物合并进来并与 Release
        # 互相覆盖（同名 exe/pdb）。这里只取 Release 包。
        name: CNCS-Release
        path: artifacts

    - name: Package
      run: |
        mkdir release -Force
        # download-artifact 已按目录结构展开，直接复制整个 Release 输出目录
        # （CNCS.exe + 依赖 DLL + pdb）
        Copy-Item "artifacts\Release\*" release\ -Recurse -Force
        $embedded = Get-ChildItem "src\embedded\*.m2" -ErrorAction SilentlyContinue
        if ($embedded) {
          mkdir release\maps -Force
          # 侧挂地图缓存：运行时从 exe 同级的 maps/ 目录读取
          Copy-Item "src\embedded\*.m2" release\maps\
        }

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
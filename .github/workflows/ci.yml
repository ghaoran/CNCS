# GitHub Actions CI/CD - Fixed for CNCS

name: CNCS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        include:
          - configuration: Debug
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON"
          - configuration: Release
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup MSBuild (pre-installed VS 2022)
      uses: microsoft/setup-msbuild@v2

    - name: Cache vcpkg
      id: cache-vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ env.VCPKG_ROOT }}/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Setup vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat

    - name: Install deps
      run: |
        # 与 VCPKG_DEFAULT_TRIPLET 保持一致：静态 CRT (/MT) 需要 x64-windows-static
        ./vcpkg/vcpkg.exe install --triplet x64-windows-static

    - name: Configure CMake
      run: |
        cmake -B build ${{ matrix.cmake_args }} -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: |
        cmake --build build --config ${{ matrix.configuration }} --parallel

    - name: Test
      if: matrix.configuration == 'Debug'
      run: |
        ctest --test-dir build --output-on-failure -C Debug

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CNCS-${{ matrix.configuration }}
        # 上传整个输出目录：CNCS.exe + vcpkg 部署的同目录依赖 DLL
        path: |
          build/bin/${{ matrix.configuration }}/
        retention-days: 30
        if-no-files-found: ignore

    - name: Format check
      continue-on-error: true
      run: |
        # runner PATH 上的 clang-format 可能是无法启动的 Store stub,
        # 用 vswhere 定位 VS 自带的真实 clang-format.exe
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) { Write-Warning "vswhere not found, skipping format check"; exit 0 }
        $vsPath = & $vswhere -latest -property installationPath
        if (-not $vsPath) { Write-Warning "VS not found, skipping format check"; exit 0 }
        $clangFormat = Get-ChildItem "$vsPath\VC\Tools\Llvm" -Recurse -Filter clang-format.exe |
                         Select-Object -First 1 -ExpandProperty FullName
        if (-not $clangFormat) { Write-Warning "clang-format not found in VS, skipping format check"; exit 0 }
        Write-Host "Using $clangFormat"
        $files = Get-ChildItem -Recurse -Path src -Include *.cpp,*.hpp,*.h,*.c |
                   Where-Object { $_.FullName -notmatch '\\external\\' } |
                   Select-Object -ExpandProperty FullName
        if ($files) {
          & $clangFormat --dry-run --Werror $files
        }

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: CNCS-*
        merge-multiple: true
        path: artifacts

    - name: Package
      run: |
        mkdir release -Force
        # 复制 Release 目录内全部内容（CNCS.exe + 依赖 DLL）
        Copy-Item "artifacts\bin\Release\*" release\ -Recurse -Force
        if (Test-Path "src\embedded\*.m2") {
          mkdir release\maps -Force
          copy src\embedded\*.m2 release\maps\
        }

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true
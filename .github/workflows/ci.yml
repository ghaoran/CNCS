# GitHub Actions CI/CD 配置

name: CNCS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    
    strategy:
      matrix:
        configuration: [Debug, Release]
        include:
          - configuration: Debug
            cmake_args: "-DCMAKE_BUILD_TYPE=Debug"
          - configuration: Release
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"

    steps:
    - name: Checkout 代码
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: 安装 Visual Studio Build Tools (C++ workload)
      run: |
        # 安装 Visual Studio Build Tools 2022 with C++ workload
        vs_installer.exe --quiet --wait --norestart --nocache ^
          --add Microsoft.VisualStudio.Workload.VCTools ^
          --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 ^
          --add Microsoft.VisualStudio.Component.Windows10SDK.22621
      shell: cmd

    - name: 设置 MSBuild 路径
      run: |
        echo "C:\Program Files\Microsoft Visual Studio\2022\Community\Msbuild\Current\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: 设置 MSVC 环境
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '2022'

    - name: 缓存 vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ github.workspace }}/vcpkg
          ${{ env.VCPKG_ROOT }}/installed
        key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: 安装 vcpkg
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/microsoft/vcpkg.git
        ./vcpkg/bootstrap-vcpkg.bat

    - name: 安装依赖
      run: |
        ./vcpkg/vcpkg.exe install --triplet x64-windows --feature-flags=manifests

    - name: 配置 CMake
      run: |
        cmake -B build ${{ matrix.cmake_args }} -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

    - name: 构建项目
      run: |
        cmake --build build --config ${{ matrix.configuration }} --parallel

    - name: 运行测试
      if: matrix.configuration == 'Debug'
      run: |
        ctest --test-dir build --output-on-failure -C Debug

    - name: 构建驱动
      run: |
        cd driver
        powershell -ExecutionPolicy Bypass -File build_driver.ps1 -Configuration ${{ matrix.configuration }} -TestSign

    - name: 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: CNCS-${{ matrix.configuration }}
        path: |
          build/bin/${{ matrix.configuration }}/CNCS.exe
          driver/x64/${{ matrix.configuration }}/CNCS_drv.sys
        retention-days: 30

    - name: 代码格式检查
      run: |
        clang-format --dry-run --Werror $(find src -name "*.cpp" -o -name "*.hpp" -o -name "*.h" -o -name "*.c")

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
    - name: 下载构建产物
      uses: actions/download-artifact@v4
      with:
        pattern: CNCS-*
        merge-multiple: true
        path: artifacts

    - name: 创建发布包
      run: |
        mkdir release
        copy artifacts\bin\Release\CNCS.exe release\
        copy artifacts\driver\x64\Release\CNCS_drv.sys release\
        # 复制地图文件
        mkdir release\maps
        copy src\embedded\*.m2 release\maps\

    - name: 创建 Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/*
        generate_release_notes: true